name: Load directory into Supabase
# Asks the Supabase function "import-directory" to load the clinic list saved on the directory-data branch.
# No secret: the call carries a short-lived GitHub token that the function checks.
on:
  workflow_dispatch:
    inputs:
      files:
        description: "Country codes of the files to load (fr it es ar …)"
        required: true
        default: "fr"
  workflow_run:
    workflows: ["Fetch directory data (France)", "Fetch directory data (OpenStreetMap)"]
    types: [completed]
permissions:
  id-token: write
  contents: read
jobs:
  load:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: |
          T=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=televet-cron" | jq -r .value)
          for cc in ${{ github.event.inputs.files || 'fr it es ar' }}; do
            curl -sS -m 300 -X POST -H "Authorization: Bearer $T" "https://elmlefrrujycgrwogyqn.supabase.co/functions/v1/import-directory?cc=$cc"; echo
          done
