name: Fetch directory data (France)
# France: downloads the public list of French veterinary establishments (SIRENE).
# Other countries: fill "countries" (e.g. IT ES AR) to download vet clinics from OpenStreetMap instead.
# Files are saved on the "directory-data" branch, from where "Load directory into Supabase" loads them.
on:
  workflow_dispatch:
    inputs:
      departments:
        description: "France: departments (space-separated), empty = all"
        required: false
        default: ""
      countries:
        description: "Other countries from OpenStreetMap (e.g. IT ES AR); when set, France is skipped"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save tsx@4
      - if: github.event.inputs.countries == ''
        run: npx tsx scripts/fetch-directory.ts ${{ github.event.inputs.departments }}
      - if: github.event.inputs.countries != ''
        run: npx tsx scripts/fetch-osm.ts ${{ github.event.inputs.countries }}
      - name: Save on the directory-data branch (other files are kept)
        run: |
          mkdir -p /tmp/out && mv data/directory-*.json /tmp/out/
          git config user.name "televet-bot"; git config user.email "bot@televet.co"
          git fetch origin directory-data && git checkout -f directory-data
          mkdir -p data && cp /tmp/out/*.json data/
          git add data && git commit -m "Directory data $(date -u +%F)" && git push origin directory-data
