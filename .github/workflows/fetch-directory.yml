name: Fetch directory data (France)
# Downloads the public list of French veterinary establishments and saves it on the "directory-data" branch,
# from where it is loaded into the database. Needs no secret and does not touch the website.
on:
  workflow_dispatch:
    inputs:
      departments:
        description: "Departments (space-separated), empty = all"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save tsx@4
      - run: npx tsx scripts/fetch-directory.ts ${{ github.event.inputs.departments }}
      - name: Save on the directory-data branch
        run: |
          mv data/directory-fr.json /tmp/directory-fr.json
          git config user.name "televet-bot"; git config user.email "bot@televet.co"
          git checkout --orphan directory-data
          git rm -rf --cached . >/dev/null; rm -rf ./* .github 2>/dev/null || true
          mkdir -p data && mv /tmp/directory-fr.json data/
          git add data/directory-fr.json
          git commit -m "Directory data $(date -u +%F)"
          git push -f origin directory-data
